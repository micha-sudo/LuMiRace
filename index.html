<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LumiRace</title>
    <link rel="stylesheet" href="style.css?v=4" />
    <style>
      html, body { margin: 0; min-height: 100%; }
      body { background: #070b18; color: #ebf7ff; font-family: "Segoe UI", sans-serif; }
      button, select { font: inherit; }
      .hidden { display: none !important; }
      .app-shell { width: min(980px, 92vw); margin: 24px auto; padding: 20px; background: rgba(12, 19, 35, .96); border: 1px solid #304b73; border-radius: 22px; }
      .topbar, .race-header, .actions, .hud { display: flex; align-items: center; gap: 12px; }
      .topbar, .race-header { justify-content: space-between; }
      .brand { font-size: 1.5rem; font-weight: 800; }
      .hud { flex-wrap: wrap; }
      .stat, .race-panel, .shop-panel { background: #101a30; border: 1px solid #304b73; border-radius: 14px; padding: 12px; }
      .stat span { display: block; color: #9bb8d4; font-size: .7rem; }
      .stat strong { font-size: 1.35rem; }
      .game-layout { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(270px, .7fr); gap: 22px; }
      .game-area { position: relative; height: 560px; overflow: hidden; touch-action: pan-y; border-radius: 14px; background: #18241e; }
      .road { position: absolute; inset: 0; background: #343a42; }
      .road-surface { position: absolute; inset: 0 13%; border-left: 3px solid #ddd; border-right: 3px solid #ddd; }
      .obstacles-layer, .diamonds-layer, .hearts-layer, .event-layer { position: absolute; inset: 0; }
      .car, .traffic-car, .diamond, .event-layer, .obstacles-layer, .diamonds-layer, .hearts-layer { position: absolute; }
      .car { width: 82px; height: 142px; bottom: 34px; background: var(--car-image) center / contain no-repeat; z-index: 8; }
      .traffic-car { width: 76px; height: 130px; background: var(--car-image) center / contain no-repeat; }
      .primary-btn, .secondary-btn, .shop-button, .play-btn { padding: 10px 16px; border: 1px solid #5276ae; border-radius: 10px; cursor: pointer; color: #fff; background: #1e55b6; }
      .secondary-btn { background: #18243b; }
      .map-picker { display: grid; gap: 4px; color: #9bb8d4; font-size: .7rem; }
      .map-picker select { padding: 8px; border-radius: 8px; background: #18243b; color: #fff; }
      @media (max-width: 900px) { .game-layout { grid-template-columns: 1fr; } .topbar, .race-header { align-items: flex-start; flex-direction: column; } .actions { flex-wrap: wrap; } }
    </style>
  </head>
  <body>
    <audio id="lobbyMusic" loop preload="auto" src="Y2Mate.is - 8-Bit Song Game Background Music For Videogame Videos.mp3"></audio>
    <audio id="driveMusic" loop preload="auto" src="Y2Mate.is - Test Drive 6 Soundtrack - Times Running Out Edit.mp3"></audio>
    <audio id="crashSound" preload="auto" src="Y2Mate.is - Car Crash Sound Effect.mp3"></audio>
    <audio id="tacoMusic" loop preload="auto" src="Y2Mate.is - Its Raining Tacos Lyrics.mp3"></audio>
    <audio id="galaxyMusic" loop preload="auto" src="Y2Mate.is - Debussy - Clair de Lune.mp3"></audio>

    <div class="app-shell">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark">◎</span>
          <span>⭐ LumiRace</span>
        </div>

        <div class="hud">
          <div class="stat" aria-label="score">
            <span>Score</span>
            <strong id="scoreValue">🏆 0</strong>
          </div>

          <div class="stat" aria-label="diamonds">
            <span>Diamonds</span>
            <strong id="diamondValue">💎 0</strong>
          </div>
        </div>
      </header>

      <main class="game-layout">
        <section class="race-panel">
          <div class="race-header">
            <div class="label">Race Bay</div>
            <div class="actions">
              <label class="map-picker" for="mapSelect">
                <span>Map</span>
                <select id="mapSelect">
                  <option value="city">Neon City</option>
                  <option value="desert">Sunset Desert</option>
                  <option value="snow">Frost Highway</option>
                </select>
              </label>
              <button id="startBtn" class="primary-btn">Start race</button>
              <button id="shopBtn" class="secondary-btn">Shop</button>
            </div>
          </div>

          <div class="track-wrap">
            <div id="gameArea" class="game-area">
              <div class="road-glow"></div>
              <div id="road" class="road">
                <div class="road-surface"></div>
                <div class="road-side left"></div>
                <div class="road-side right"></div>

                <div id="playerCar" class="car player-car" aria-label="Player car"></div>
                <div id="obstacles" class="obstacles-layer"></div>
                <div id="diamonds" class="diamonds-layer"></div>
                <div id="hearts" class="hearts-layer"></div>
                <div id="tacos" class="event-layer"></div>
                <div id="stars" class="event-layer"></div>
                <div id="crashOverlay" class="crash-overlay">
                  <div class="crash-card">
                    <span>CRASH</span>
                    <div class="crash-actions">
                      <button id="crashShopBtn" class="secondary-btn">💎 Open shop</button>
                      <button id="tryAgainBtn" class="primary-btn">↻ Try again</button>
                    </div>
                  </div>
                </div>
                <div id="messageBanner" class="message-banner">Ready?</div>

                <div class="game-speed" aria-label="speed gauge">
                  <div class="gauge-ring"></div>
                  <div class="gauge-needle" id="speedNeedle"></div>
                  <div class="gauge-center"></div>
                  <div class="gauge-text" id="speedValue">0</div>
                </div>
              </div>
            </div>
          </div>
        </section>

        <aside class="shop-panel hidden" id="shopPanel">
          <div class="panel-head">
            <h2>Garage Shop</h2>
            <span id="walletValue">0 diamonds</span>
          </div>
          <div id="shopList" class="shop-list"></div>
        </aside>
      </main>
    </div>

    <script src="script.js?v=4"></script>
  </body>
</html>
